<section class="document-graph" aria-label="문서 연결 그래프">
  <div class="document-graph__controls" role="group" aria-label="그래프 보기 조절">
    <button type="button" class="document-graph__reset" aria-label="그래프 선택과 확대 초기화">Reset</button>
    <button type="button" data-zoom="in" aria-label="그래프 확대" title="확대">+</button>
    <button type="button" data-zoom="out" aria-label="그래프 축소" title="축소">−</button>
    <label class="document-graph__motion"><input type="checkbox"> 확대 애니메이션</label>
  </div>
  <svg role="group" aria-label="문서 연결 그래프"></svg>
  <script type="application/json" class="document-graph__data">{{ config.extra.document_graph | tojson }}</script>
</section>
<style>{% include "partials/document-graph.css" %}</style>
