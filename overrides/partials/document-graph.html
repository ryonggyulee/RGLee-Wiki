<section class="document-graph" aria-label="문서 연결 그래프">
  <header class="document-graph__header">
    <div class="document-graph__heading">
      <strong>문서 지도</strong>
      <div class="document-graph__status" aria-live="polite" aria-atomic="true">
        <span class="document-graph__summary"></span>
        <a class="document-graph__open" hidden></a>
      </div>
    </div>
    <div class="document-graph__controls" role="group" aria-label="지도 보기">
      <button type="button" data-zoom="out" aria-label="그래프 축소" title="축소">−</button>
      <button type="button" data-zoom="in" aria-label="그래프 확대" title="확대">+</button>
      <button type="button" class="document-graph__reset" aria-label="그래프 선택과 확대 초기화" title="전체 보기">전체 보기</button>
    </div>
  </header>
  <svg class="document-graph__canvas" role="group" aria-label="문서 연결 그래프"></svg>
  <div class="document-graph__legend" role="group" aria-label="분류로 이동"></div>
  <script type="application/json" class="document-graph__data">{{ config.extra.document_graph | tojson }}</script>
</section>
<style>{% include "partials/document-graph.css" %}</style>
<script>/*
