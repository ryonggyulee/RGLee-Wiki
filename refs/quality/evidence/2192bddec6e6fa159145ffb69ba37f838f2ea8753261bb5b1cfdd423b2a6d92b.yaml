  findings:
  - id: cycle
    claim: 순차 노출과 표면 자리의 포화가 두께 제어를 가능하게 한다. 시간 분할에서는 퍼지가 잔류 반응물·부산물과 기상 성장분을 줄인다.
    locations:
    - description·도입
    - §1(1)
    - §3(1) Measurement
    - §5 첫 항목
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1016/B978-012512908-4/50005-9
      provenance: Ritala & Leskelä, Handbook of Thin Film Materials (2002)
      locator: §3.1, Fig. 1, §7.1.1, Fig. 18
      supports: 반응물의 교대 노출, 퍼지 또는 배기, 포화 곡선과 사이클 반복을 설명한다.
    - id: 10.1021/cm0304546
      provenance: Groner et al. (2004), Colorado thermal Al₂O₃ QCM/film study
      locator: pp. 640–642, 반응 (A,B), Figs. 4–5 및 Table 1
      supports: TMA와 물의 주입·퍼지를 개별적으로 바꾼 QCM 자료에서 짧은 퍼지가 추가 성장을 일으킨다.
    - id: 10.1063/1.5060967
      provenance: Cremers, Puurunen & Dendooven (2019), conformality review
      locator: §II, ALD reactors 및 exposure
      supports: 시간 분리와 공간 분리, 분자 노출과 흡착 포화를 구분한다.
    check: 고정된 사이클 수에서 각 주입·퍼지를 독립적으로 바꾸는 제안은 실험의 변인 통제와 일치한다. 실제 QCM의 질량 증가와 본문의 두께 기반 진단은 동일 조건에서 비교한 성장 지표다.
    assumptions: 이원 시간 분할의 전형적인 사이클 및 자기 제한 조건. 초기 핵생성까지 두께가 원점을 지나 선형이라는 전제가 없다.
  - id: fraction
    claim: 반응 가능한 자리와 리간드의 입체 장애에 따라 사이클당 성장이 한 원자층보다 작을 수 있다.
    locations:
    - §1(1) 둘째 문단
    - 도입
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1016/B978-012512908-4/50005-9
      provenance: Ritala & Leskelä, Handbook of Thin Film Materials (2002)
      locator: §3.1 및 §7.1.1.1
      supports: 표면 자리 수와 부피가 큰 리간드에 의한 차폐를 부분 단층 성장의 원인으로 설명한다.
    - id: 10.1002/cvde.200306265
      provenance: Puurunen (2003), independent ligand/adsorbate GPC model
      locator: 원논문 초록과 GPC 모형의 결론
      supports: 반응자리와 리간드가 차지하는 면적의 경쟁으로 흡착이 포화되고 한 층보다 작은 GPC가 가능하다.
    check: 포화의 기준은 주어진 반쪽 반응의 접근 가능한 자리를 모두 사용했는지이며 기하학적 단층의 완성과 다르다.
    assumptions: 포화된 단위 면적에서의 평균 성장량. 언제나 단층 미만이라는 주장을 포함하지 않는다.
  - id: thermal-exchange
    claim: TMA·물 반쪽 반응에서 각각 CH₄가 생성된다. 단일 결합 교환과 다중 표면 결합은 양립하며 식만으로 성장량을 결정할 수 없다.
    locations:
    - §1(2) 반응 설명, 두 식과 직후 해설
    - §5 둘째 항목
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: 10.1021/cm0304546
      provenance: Groner et al. (2004), Colorado thermal Al₂O₃ QCM/film study
      locator: p. 640, reactions (A) and (B)
      supports: OH의 양성자와 TMA 메틸기가 메테인을 형성하고 이어 물이 표면 Al–CH₃를 Al–OH로 바꾼다.
    - id: 10.1063/1.2924406
      provenance: Heil et al. (2008), low-pressure time-resolved diagnostics
      locator: p. 103302-2, Eqs. (1,2), QCM analysis Eqs. (3–5)
      supports: 동일 결합 변화, TMA 흡착 때 이탈하는 메틸기의 수, 70 °C에서 주로 두 결합을 통한 흡착을 다룬다.
    - id: 10.1116/6.0002158
      provenance: Mione et al. (2022), spatial atmospheric-pressure IR/OES dataset
      locator: 반응 (2) 주변의 mono-/bifunctional 흡착 논의
      supports: 표면 수산기 가용성과 TMA 흡착 양식을 연관시킨다.
    check: 첫 식에서 S를 제외한 원자수는 좌우 모두 Al₁O₁C₃H₁₀이다. Al–Me + H₂O → Al–OH + CH₄에서 S′를 제외하면 Al₁O₁C₁H₅이다. 면적당 반응 횟수 또는 자리 밀도를 주지
      않아 총 Al 개수와 두께를 산출할 수 없다.
    assumptions: S와 S′는 각각 보존되는 표면 골격이다. 두 식은 개별 결합 교환을 표시하며 서로 더하여 Al₂O₃ 단위 하나의 총괄 반응으로 삼지 않는다.
  - id: plasma-chemistry
    claim: 산소 플라즈마의 라디칼이 메틸기를 산화하여 CO₂와 물을 만들고, 생성된 물이 다시 메틸기와 반응하여 CH₄를 생성할 수 있다.
    locations:
    - §2(1) 첫 문단
    - §5 둘째 항목
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1063/1.2924406
      provenance: Heil et al. (2008), low-pressure time-resolved diagnostics
      locator: p. 103302-1, 시간분해 질량분석·광방출 결과와 결론
      supports: 산소 라디칼 소비, H₂O/CO₂/CO와 소량 CH₄ 방출을 확인한다.
    - id: 10.1116/6.0002158
      provenance: Mione et al. (2022), spatial atmospheric-pressure IR/OES dataset
      locator: Fig. 4, 반응 (5,6) 및 해석
      supports: 별도 대기압 공간 분할 장치의 배기가스 IR에서 CO₂, H₂O, CH₄를 관측하고 물에 의한 이차 교환 반응을 제안한다.
    check: 서로 다른 장치와 측정 데이터에서 가스 생성물과 복수 반응 경로 해석이 일치한다. 이차 반응을 가능성으로 기재한 강도도 일치한다.
    assumptions: TMA 기반 산화알루미늄의 비교. 한 종류의 배기가스로 표면 메틸기의 경로별 수율을 확정하지 않는다.
  - id: temperature-mass
    claim: PEALD에서 낮은 온도로 리간드 제거와 성장이 가능하다. 두께, 면적당 Al 수, 막 밀도와 수소 함량은 서로 다른 성장 지표다.
    locations:
    - §2(1) 둘째 문단
    - §5 둘째·셋째 항목
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1021/cm0304546
      provenance: Groner et al. (2004), Colorado thermal Al₂O₃ QCM/film study
      locator: 초록 및 저온 막 조성·밀도 측정
      supports: 열 ALD 산화알루미늄에서 성장 온도를 낮추면 밀도가 낮아지고 수소 함량이 증가한다.
    - id: 10.1149/1.3428705
      provenance: Potts et al. (2010), thermal/plasma temperature comparison
      locator: Al₂O₃ results, Figs. 5–6
      supports: 열 및 플라즈마 성장에서 면적당 Al 수와 두께 증가가 밀도에 따라 달리 보이며 수소·밀도도 측정했다.
    - id: 10.1116/6.0002158
      provenance: Mione et al. (2022), spatial atmospheric-pressure IR/OES dataset
      locator: Fig. 4와 Discussion, 반응 (5,6)
      supports: 산소 활성종에 의한 리간드 제거를 온도별 반응 생성물로 분석한다.
    check: 단위면적당 Al 수는 조성이 주어졌을 때 두께와 밀도의 곱에 비례한다. 서로 다른 온도에서 두께만으로 Al 양을 단정할 수 없다는 권고는 양쪽의 실험과 일치한다.
    assumptions: 특정 알루미나 공정의 관측 및 비교 방법, 모든 기판에서 동일한 최저 온도나 조성 변화를 보장하지 않는다.
  - id: plasma-geometry
    claim: 직접형·원격형 기하, 압력과 출력은 활성종 노출에 영향을 준다. ZnO/고분자 실험과 원격 금속산화물 소자 실험에서 기판의 형태·전기적 반응이 각각 관찰됐다.
    locations:
    - §2(2) 두 문단
    - §3(1) 플라즈마 기록 조건
    - §5 둘째 항목
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1016/j.surfcoat.2017.07.056
      provenance: Napari et al. (2017), separate ZnO reactor/substrate experiment
      locator: accepted manuscript, Introduction, abstract 및 Fig. 10
      supports: 직접 방전과 afterglow 배치, 직접형/원격형 ZnO의 조성과 결정성 차이, 직접 처리한 polycarbonate AFM 표면 형태 변화를 보고한다.
    - id: 10.1149/1.3552663
      provenance: Profijt et al. (2011), ion-energy/flux and VUV measurements
      locator: pp. G88–G91, Figs. 1–3 및 전기적 특성 측정
      supports: 원격 O₂ 방전에서 기판 위치 이온 에너지·플럭스와 압력·출력 의존성을 측정하고 VUV에 의한 전기적 영향을 분리했다.
    check: 두 연구는 독립된 장치·기판을 사용한다. 전자는 ZnO와 고분자 형태, 후자는 금속산화물 전기 구조라는 사례 귀속을 확인했다. O₂ 분압만으로 기판 O 라디칼 플루언스를 정할 수 없다는 설명은 공급
      기체와 실제 활성종의 구분에 따른다.
    assumptions: 원격에서도 조건에 따라 이온이 남을 수 있다. 특정 고분자의 형태 변화를 모든 원격 공정이나 모든 기판에 일반화하지 않는다.
  - id: nitride
    claim: TMA에 O₂ 또는 NH₃ 플라즈마를 조합하여 Al₂O₃ 또는 AlN을 성장시킬 수 있으며 산화·질화 공정에서 각각 포화 조건을 확인해야 한다.
    locations:
    - §2(3)
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1149/1.3301664
      provenance: Dendooven et al. (2010), Ghent oxide/nitride structures
      locator: pp. G112–G113, Conformality of AlN, Fig. 5(a–d)
      supports: 종횡비 약 10의 구조에 같은 TMA 노출을 주고 O₂ 또는 NH₃ 플라즈마를 각각 3, 9, 18초 노출한 별개 실험을 대조했다. 깊이별 분광 타원측정 두께에서 산화물의 피복성이 더 좋다.
        질화 공정에서 깊이가 증가할 때 굴절률 모형 계수 A가 약 1.9에서 1.6으로 감소하므로 저자들은 내부의 막 조성이 변할 수 있다고 해석했다. 본문은 AlN 성장 가능성만 주장한다.
    - id: 10.1039/D4TC01867B
      provenance: Mpofu et al. (2024), plasma/thermal AlN saturation and mass spectrometry
      locator: Fig. 1(a), pp. 12819–12820
      supports: AlN 질화에서 TMA 주입 길이와 NH₃ 플라즈마 시간을 각각 바꾼 성장 곡선을 제시한다.
    - id: 10.1063/1.2924406
      provenance: Heil et al. (2008), low-pressure time-resolved diagnostics
      locator: 초록 및 산화 공정의 시간분해 흡착 실험
      supports: 별도 실험에서 TMA/O₂의 산화물 성장 및 전구체 포화를 확인했다.
    check: 공반응물이 공급하는 원소의 차이와 개별 포화 시험은 각 원 연구의 실제 반응물과 측정축에서 확인된다.
    assumptions: 두 가지 Al 공정의 예. 질화를 위해 특정 보편적인 시간이나 온도를 지정하지 않는다.
  - id: exposure
    claim: 분자 노출은 분압을 주입 시간에 걸쳐 적분한 양이며, 거의 일정한 분압에서는 압력과 시간의 곱이다.
    locations:
    - §3(1) 첫 문단
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: 10.1063/1.5060967
      provenance: Cremers, Puurunen & Dendooven (2019), conformality review
      locator: §II.D Exposure in ALD
      supports: 분자 노출을 반응물 분압과 주입 시간의 곱으로 정의하고 평면과 고종횡비 구조의 필요 노출을 비교한다.
    - id: 10.1016/B978-012512908-4/50005-9
      provenance: Ritala & Leskelä, Handbook of Thin Film Materials (2002)
      locator: §7.1.1, pulse time과 precursor flux의 효과
      supports: 공급 플럭스와 시간의 곱으로 분자 dose를 근사하고 둘의 효과를 논의한다.
    - id: 10.1016/j.surfcoat.2017.07.056
      provenance: Napari et al. (2017), separate ZnO reactor/substrate experiment
      locator: Introduction, plasma configuration
      supports: 분자 공급량과 활성종 밀도를 구분하는 데 필요한 방전 매개변수와 배치를 제시한다.
    check: 짧은 시간 구간에서 분압을 일정하다고 보고 pᵢΔtᵢ를 합해 극한을 취하면 ∫p_A(t)dt, 일정 분압 p₀에서는 p₀Δt이고 단위는 Pa·s이다. 동일한 밸브 시간만으로 노출이 일정해지지 않는다.
    assumptions: 노출은 표면 근처 분자 A의 압력–시간 단위 규약이며 플라즈마 라디칼 수/면적이나 순흡착량과 별도이다.
  - id: window
    claim: 노출 포화와 온도에 대한 GPC 평탄 구간은 구별된다. 온도에 따른 표면 수산기 수, 저온 반응 속도·응축, 고온 탈착·분해가 서로 다른 경향을 일으킬 수 있다.
    locations:
    - §3(2) 전체
    - §3(1)의 노출·퍼지 진단
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1016/B978-012512908-4/50005-9
      provenance: Ritala & Leskelä, Handbook of Thin Film Materials (2002)
      locator: §7.1.1.1 및 §7.1.1.4, Figs. 18–19
      supports: 노출 시간에 대한 포화와 온도별 평탄 또는 기울어진 자기 제한 성장, 양쪽 온도 극단의 네 원인을 구분한다.
