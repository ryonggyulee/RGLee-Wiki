    - id: https://commons.wikimedia.org/wiki/File:ALD_basics_illustration.svg
      provenance: Piechulla, Puurunen, Chen, Goulas and van Ommen 2025 original drawing
      locator: Summary, Licensing, original SVG panels a–d
      supports: 2025-06-21, 명시된 5인 저작 및 CC BY 4.0. (a) 네 단계, (b) 시간별 분압, (c) 흡착량, (d) 온도별 GPC와 window이다.
    check: Commons 원본 SVG를 받아 얻은 SHA-256이 assets의 dd046f42…와 동일했다. 바이트가 같은 그림을 렌더링하여 (c)의 검정 곡선이 분홍 주입 구간 안에서 평탄해지고 회색 퍼지에서
      이어지는 모습을 직접 확인했다.
    assumptions: 도식은 정성적 예시이다. (c)의 이상 곡선과 여러 점선의 다른 흡착 거동을 구분했다.
  - id: thermal-four-steps
    category: scientific
    status: supported
    method: derivation
    locations:
    - §2(1)–(4)의 두 식과 퍼지
    - §4(1) 표의 열 ALD 열
    - §7 첫 항목
    claim: OH가 있는 표면에서 TMA와 물을 차례로 반응시키면 각각 메테인이 나올 수 있고, 첫 퍼지 후 메틸기와 둘째 퍼지 후 수산기가 유지된다.
    sources:
    - id: 10.1021/cm0304546
      provenance: Groner et al. 2004 thermal ALD
      locator: §2B, p. 640 reactions A/B, Fig. 5, Table 1, §4A
      supports: 단일 OH 및 Al–메틸의 교환식, TMA/질소/물/질소 순서, 짧은 퍼지에서 추가 성장 및 저온에서의 긴 물 퍼지를 보고한다.
    - id: 10.1063/1.2940598
      provenance: Langereis et al. 2008 differential surface IR
      locator: Fig. 2(a), p. 231904-2
      supports: 열 공정과 플라즈마 공정에서 TMA 뒤 CH₃ 증가와 OH 소모, 산화 단계 뒤 OH 회복을 직접 비교한다.
    - id: 10.1063/1.2924406
      provenance: Heil et al. 2008 QCM/QMS
      locator: §III.B, Eqs. 3–5 and p. 103302-6
      supports: TMA에 붙은 여러 메틸기 중 둘 이상이 떨어질 수 있는 결합과 다른 온도의 열 공정 자료를 명시한다.
    check: 표면 골격을 고정하고 Me=CH₃를 넣으면 첫 식 양변의 나머지 원자 수는 Al₁O₁C₃H₁₀, 둘째 식은 Al₁O₁C₁H₅로 각각 같다. 둘째 식의 Al은 이미 표면에 있으며 물은 추가 Al을 공급하지
      않는다. 각 퍼지는 직전 기체 반응물과 휘발성 메테인을 분리한다.
    assumptions: 각 식은 교환 한 번을 나타낸다. 한 TMA가 인접한 OH에도 결합할 수 있으며, 전체 막의 고정 배위수나 한 사이클의 완전 단층을 가정하지 않는다.
  - id: growth-and-substrate
    category: scientific
    status: supported
    method: derivation
    locations:
    - §3(1) 및 Measurement
    - §7 둘째 항목
    claim: 초기 기판의 표면기가 다르면 성장량이 달라질 수 있고, 정상 성장의 두께 기울기에서 평균 GPC를 구한다.
    sources:
    - id: 10.1063/1.2077840
      provenance: Sturm et al. 2005 XPS
      locator: p. 076104-1 and Fig. 1
      supports: 300 °C TMA–물의 초기 1–4회 증착에서 XPS로 면적당 Al을 평가하여 HF-last Si에서 산화 Si보다 적은 초기 축적을 관측했다.
    - id: 10.1021/acs.langmuir.9b01600
      provenance: Vandalon–Kessels 2019 initial growth experiment
      locator: Fig. 2(a,b), GPC during Initial Growth
      supports: 서로 다른 Si 시작 표면의 두께 곡선과 그 차분을 비교하면 초기 경향이 다르고 이후 같은 기울기에 도달한다.
    - id: 10.1063/1.2924406
      provenance: Heil et al. 2008 ellipsometry
      locator: Figs. 2–3, §III.A
      supports: 사이클 수별 두께 기울기와 한 사이클 안의 TMA 투입량별 GPC를 별도 축에서 측정했다.
    check: 연속 사이클 증분을 N₁+1부터 N₂까지 합하면 중간 두께가 소거되어 d(N₂)−d(N₁)가 남는다. 이를 N₂−N₁로 나누면 nm/cycle의 구간 평균이다. 서로 다른 기판의 초기 구간까지 하나의
      정상 기울기를 대입하지 않았다.
    assumptions: N₂>N₁, 동일한 공정·두께 기준. 산화막이 기판을 덮은 뒤 재현되는 표면 상태에서의 정상 성장에 한정했다.
  - id: exposure-qcm-purge
    category: scientific
    status: supported
    method: source
    locations:
    - §3(2) 전체
    - §3(3) 온도 곡선과의 구별
    - §7 둘째 항목
    claim: 반응물 노출과 퍼지를 각각 바꾸어 포화와 반응물 중첩 가능성을 검사할 수 있다. Heil의 연속 TMA QCM과 Groner의 58 °C 질량/사이클 곡선은 서로 다른 측정이다.
    sources:
    - id: 10.1021/cm0304546
      provenance: Groner et al. 2004 thermal QCM
      locator: Figs. 2–5, Table 1, pp. 641–644 §§3A and 4A
      supports: 58 °C에서 개별 반응물 공급과 퍼지를 따로 바꾸었다. 긴 주입에도 질량/사이클 곡선의 작은 기울기가 남았고 짧은 퍼지에서 질량 증가량이 더 컸다.
    - id: 10.1063/1.2924406
      provenance: Heil et al. 2008 plasma QCM
      locator: Figs. 3 and 7(c), pp. 103302-4 and -7
      supports: 15회 연속 TMA 주입에서 5–6회 후 QCM 질량 증가가 검출되지 않았다. 별도로 주입 횟수를 바꾸며 한 사이클의 성장량도 확인했다.
    - id: 10.1063/1.5060967
      provenance: Cremers et al. 2019 exposure conventions
      locator: §II.D–E, p. 021302-5
      supports: 분압과 시간의 곱, 반응 확률 및 포화에 필요한 노출량을 구별한다.
    check: 표면 근처의 분자 분압이 일정하면 노출량의 시간적분은 분압×시간이고 차원은 Pa·s이다. Heil의 산화 전 QCM 시간 이력과 Groner의 완성 사이클 증가량을 구별했다. Groner는 낮은 온도에서
      완만한 접근 및 고정 퍼지가 긴 노출에 부족했을 가능성을 함께 언급한다. 본문은 퍼지 의존성도 따로 점검한다.
    assumptions: 비교 대상 이외의 노출 및 온도는 고정한다. 완만한 포화는 가능한 해석이며, GPC만으로 표면 반응 경로를 유일하게 알아낼 수 있다고 해석하지 않는다.
  - id: plasma-oxidant-and-surface
    category: scientific
    status: supported
    method: source
    locations:
    - §4(1) 비교표와 앞뒤 문단
    - §7 셋째 항목
    claim: 시간 분할 TMA–산소 플라즈마에서는 첫 퍼지 뒤 산화가 일어나고, 다음 TMA에 반응하는 수산기가 형성된다. 산화·물 매개 교환이 서로 다른 부산물을 만든다.
    sources:
    - id: 10.1063/1.2940598
      provenance: Langereis et al. 2008 surface film IR experiment
      locator: Figs. 1 and 2, pp. 231904-2–3
      supports: 플라즈마 노출과 TMA 주입 전후의 차분 IR로 25–150 °C의 주된 OH/메틸 종결기를 판별했다. 25 °C에서 플라즈마 시간을 늘리면 탄소계 잔류종이 줄었다.
    - id: 10.1063/1.2924406
      provenance: Heil et al. 2008 low-pressure QMS/QCM/OES
      locator: §II.A, §§III.C–D, Figs. 6–10
      supports: 잔류 기체를 비운 뒤 방전하고 다음 주입 전에 이를 끝낸다. TMA 뒤 메테인, 플라즈마 뒤 물과 CO₂가 검출되며 GPC의 플라즈마 시간 포화를 별도 검사했다.
    - id: 10.1116/6.0002158
      provenance: Mione et al. 2022 atmospheric spatial reactor exhaust IR
      locator: Fig. 4 and Eqs. 5–6, p. 062407-8
      supports: 별도 장치와 가스 분석으로 메틸의 산화와 생성된 물의 근접 메틸 교환을 구분하고 Al–OH를 재생하는 경로를 제시한다.
    check: Langereis의 표면 IR과 Heil·Mione의 각기 다른 반응기에서 측정한 기체 생성물을 구별했다. Mione의 공간 분할 실험은 화학의 근거로만 사용했다. 표의 시간적 순서는 Heil의 시간
      분할 실험에 대응한다. 산소 분압 하나로 라디칼 도달량이 정해지지 않는다는 결론은 Heil의 거의 일정한 분압에서 방전을 켜고 끄는 절차 및 원격·직접형의 기존 근거와 양립한다.
    assumptions: TMA 기반 알루미나의 산소 플라즈마 산화 예시이다. 주된 표면기와 가능한 부산물이라는 범위에서 비교한다.
  - id: window-comparison
    category: scientific
    status: supported
    method: source
    locations:
    - §3(3) 그림 1(d)
    - §4(1) 저온 성장 해석
    claim: 반응물별 포화와 온도에 따른 GPC 평탄 구간은 측정 조건이 다르며, Al₂O₃의 온도별 두께 증가량에는 표면기와 막 특성의 변화도 반영될 수 있다.
    sources:
    - id: 10.1021/cm0304546
      provenance: Groner et al. 2004 thermal film characterization
      locator: Figs. 4, 6, 9 and 11, §4A–C
      supports: 반응물 노출과 온도를 별도 변화시키고 온도 하강 시 밀도 감소·수소 증가를 측정했다. 두께와 QCM 성장량의 변환은 밀도에 의존한다.
    - id: 10.1116/6.0002158
      provenance: Mione et al. 2022 temperature study
      locator: Fig. 5 and discussion after Eqs. 5–6
