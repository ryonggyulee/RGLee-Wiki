  summary: 최종 SHA의 변경 및 영향을 받는 가정에서 9개 finding을 확인했다. 독립 원문에서 포화와 퍼지, 열·플라즈마 표면기와 생성물, 측정 대상 및 도식의 원본을 대조했고 두 반응식과 두께의 구간
    평균을 검산했다. 근거 부족·접근 불가·불일치로 남은 항목은 0개이다.
