  findings:
  - id: site-ligand-saturation
    category: scientific
    status: supported
    method: source
    locations:
    - 도입
    - §1, 그림 1(c)
    - §2(1),(3)
    - §7
    claim: 흡착 가능한 자리의 소모나 리간드에 의한 입체 장애로 A의 추가 흡착이 포화될 수 있고, B가 다음 A에 반응하는 표면을 만든다.
    sources:
    - id: 10.1016/B978-012512908-4/50005-9
      provenance: Ritala–Leskelä handbook chapter 2002
      locator: §3.1, PDF p. 4
      supports: 포화된 화학흡착층에서도 자리 밀도·리간드 입체 장애 때문에 한 단층분보다 적은 금속이 남을 수 있다. 과량분은 이후 퍼지한다.
    - id: 10.1063/1.5060967
      provenance: Cremers–Puurunen–Dendooven 2019
      locator: p. 021302-5, §II.E, 식 5–10
      supports: 미점유 자리 분율과 반응 확률 관계 및 B 반응으로 다음 A에 대한 표면 반응성 회복을 설명한다.
    - id: 10.1063/1.2924406
      provenance: Heil et al. 2008 precursor pulse experiment
      locator: Fig. 7(a–c), p. 103302-7
      supports: TMA를 산화제 없이 반복하면 후반 주입에서 질량 증가가 멈추고 미반응 TMA가 검출된다.
    - id: https://publications.iupac.org/books/rbook/Red_Book_2005.pdf
      provenance: IUPAC Red Book 2005
      locator: IR-9.1.2.2–4, pp. 144–145
      supports: 리간드는 중심 원자에 결합한 원자 또는 원자단이다. Heil 등의 TMA 메틸 리간드와 같은 용법이다.
    check: 유한한 자리 수와 입체 장애는 가능한 포화 원인이다. 화학흡착 유지, 같은 반응물의 재노출, 다음 반쪽 반응에 의한 재활성화가 그림 및 실험과 일치한다.
    assumptions: 안정한 화학흡착을 하는 이상적 반쪽 반응. A와 B는 설명에 사용한 이원 순차 공정의 반응물이다.
