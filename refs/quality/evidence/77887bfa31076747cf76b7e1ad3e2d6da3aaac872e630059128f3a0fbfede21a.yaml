      supports: Independent electronic-structure implementation gives squared wavefunctions times energy deltas, planar averaged
        and spin summed in its illustrated case.
    check: For one spin and no averaging insert ψ_n=Σα aαnφα in the pointwise spectral weight. Squaring produces α≠β terms;
      ∫d³r |ψ_n|²=1 gives |ψ|² length⁻³ and δ energy⁻¹. A local spectrum carrying weights 0.8 and 0.2 at energies 0 and 2
      has centroid 0.4, principal peak at 0 for narrow equal broadening, and upper spectral edge at 2. Thus a moment, peak,
      and edge can differ.
    assumptions: LDOS of states retained in the reduced space; spin-resolved, normalized states. Basis truncation can degrade
      LDOS even for useful eigenvalues.
  - id: interior-spectrum
    claim: An interior spectral window need not improve monotonically with a larger basis. A common expectation value alone
      cannot certify the target span or occupations.
    locations:
    - §§4.3, 5.1–5.2, 7–8
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: 10.1063/1.3560956
      provenance: Vukmirović–Wang 2011 JCP original OFM study
      locator: Sec. III.B, Figs. 4–6; Sec. IV, Fig. 10
      supports: Targeting both ends of an occupied spectrum yields different basis-selection behavior, gap identification
        heuristic.
    - id: https://netlib.org/utk/people/JackDongarra/etemplates/node178.html
      provenance: Bai and Li, SIAM Templates 2000
      locator: §5.7.1 equivalent Hermitian eigenproblem and residual-vector subsection
      supports: Equivalence of positive-definite pencils to Hermitian eigenproblems and the role of residuals, allowing a
        direct finite counterexample.
    check: Take H=diag(−1,0,1). A trial vector (1,0,1)/√2 gives the single Ritz value 0. After adding (1,0,−1)/√2 the two
      Ritz values are ±1 and the interior target 0 is lost. For H+C I, isolated eigenvalues all shift by C; comparing fragments
      with different unknown constants requires alignment. A fixed number of columns contains no information on how many lower-energy
      filled levels were omitted.
    assumptions: Interior eigenvalues are compared by target energy rather than an identical eigenvalue index in a full ordered
      spectrum. No general Fermi-level prescription follows for metals, junctions, or nonequilibrium partial occupations.
