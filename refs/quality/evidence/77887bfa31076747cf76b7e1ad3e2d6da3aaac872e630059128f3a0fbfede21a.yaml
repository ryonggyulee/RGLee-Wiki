      provenance: QuantumATK LDOS implementation documentation
      locator: LocalDensityOfStates, Notes and displayed spectral formula
      supports: Sum of weighted |ψ(r)|² times an energy delta or broadened kernel.
    - id: https://west-code.org/doc/West/v6.2.1/tutorials/basic/basic_004.html
      provenance: WEST electronic spectra implementation tutorial
