  - id: ofm-projection
    claim: Overlapping finite-fragment eigenfunctions supply trial columns for projection of the full operator, giving a global
      Ritz solution and distinct stages of basis generation, matrix construction and diagonalization.
    locations:
    - Description, opening, §§1–3.2, 7–8
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: 10.1063/1.3560956
      provenance: Vukmirović–Wang 2011 JCP original OFM study
      locator: Secs. I–II, Fig. 1, Eqs. (1)–(2)
      supports: Fragment-state transfer and overlap integrals of the whole-system operator, generalized eigenproblem and reconstruction.
    - id: https://deepblue.lib.umich.edu/bitstream/handle/2027.42/110475/phanim_1.pdf
      provenance: P. Motamarri, Michigan finite-element KS dissertation
      locator: §3.1.3, Eqs. (3.28)–(3.31)
      supports: Independent nonorthogonal Galerkin discretization derives a Hamiltonian/mass-matrix pencil from inner products.
    - id: https://scl.ipb.ac.rs/papers/Vukmirovic_JPCC_2012.pdf
      provenance: Vukmirović et al. 2012 APFO-3 calculation, new structures and benchmark
      locator: Methods and SI pp. S5–S6, Figs. 5–6
      supports: Separate APFO-3 structures use overlapping fragment eigenfunctions and fixed-H plane-wave reference. Shares
        the OFM inventor. Distinct test data, no independent reimplementation of the original P3HT study.
    check: Write Φa for the reconstructed wavefunction and impose Φ†(HΦa−EΦa)=0. The same H enters every basis pair. A direct
      sum of isolated-fragment Hamiltonians has no such identity.
    assumptions: Fixed one-electron H, finite trial span. Ritz values of the exact projected pair must additionally be converged
      with respect to any numerical truncation of integrals.
