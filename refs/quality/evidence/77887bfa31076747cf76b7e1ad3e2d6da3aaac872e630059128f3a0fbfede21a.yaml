    check: LS3DF global Hartree term uses the assembled density; Eq. (3) retains a fragment-dependent boundary correction.
      A mode-space representative basis targets a spectrum, whereas the defining OFM trial functions are finite-fragment eigenfunctions.
      For the CPM and OFM rows see cpm-ks and ofm-projection.
    assumptions: Similar projection principle does not identify the construction of the basis or the physical tests. LS3DF
      energy entails additional kinetic and other terms alongside the total-density electrostatic term.
