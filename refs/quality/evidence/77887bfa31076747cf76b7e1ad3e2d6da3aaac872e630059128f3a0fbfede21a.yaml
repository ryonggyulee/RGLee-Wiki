  - id: locality-scaling
    claim: Fixed fragment size, basis size and neighbor cutoff give linear local assembly, while a conventional full dense
      solve costs cubic work in reduced dimension.
    locations:
    - §5.3; §§1, 8
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: 10.1063/1.3560956
      provenance: Vukmirović–Wang 2011 JCP original OFM study
