    - id: https://deepblue.lib.umich.edu/bitstream/handle/2027.42/110475/phanim_1.pdf
      provenance: P. Motamarri, Michigan finite-element KS dissertation
      locator: §3.1.3, Eqs. (3.28) onward
      supports: Finite basis expansion and projected Hamiltonian and metric.
    check: Substitute Φ=χU to get U†HU and U†SU. For a square invertible U, det[U†(H−ES)U]=|det U|² det(H−ES). The norm is
      c†S_r c so rank S_r=rank Φ. Two identical normalized columns give Gram eigenvalues 0,2. The illustrated 5×3 coefficient
      matrix is precisely the three windows. For the 12000×300 map the two reduced matrices are 300×300. Multiplication by
      Δv(r) gives ∫φ*α Δv φβ and can generate off-diagonal terms. A scalar potential shift C gives ΔH=CS. This accounts for
      energy-reference shifts and shows why a diagonal matrix element need not equal the diagonal after symmetric orthogonalization.
    assumptions: Fixed H and common AO representation; equality of spectra requires an invertible complete change of basis.
      Direct matrix elements can be built one pair at a time. Occupied count, rank, and chosen number of columns are separate.
  - id: bloch-and-models
    claim: Two coupled fragment levels and a periodic nearest-neighbor chain yield the stated illustrative spectra. Fourier
      sums for H and S extend to a periodic localized basis.
    locations:
    - §§4.1, 4.4
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: 10.1103/PhysRevB.107.235135
      provenance: Koepernik et al. symmetry-conserving FPLO projection
      locator: §II.A Eqs. (1)–(3), inspected arXiv:2111.09652
      supports: Bloch sums with basis-position or lattice-only phase, Hamiltonian and overlap matrices, k-dependent generalized
        eigenproblem.
    - id: https://www.cond-mat.de/events/correl11/manuscripts/kunes.pdf
      provenance: J. Kuneš, Jülich 2011
      locator: §2 Eqs. (5)–(6) and text on nonorthogonal translates
      supports: Bloch sums of translated orbitals and reciprocal-space Fourier sum of overlaps.
    check: Define O(R)=〈0α|O|Rβ〉 and |kβ〉=Σ_R exp(ik·R)|Rβ〉/√N. Translational symmetry collapses the double sum to O(k)=Σ_R
      exp(ik·R)O(R), for O=H,1. One site per cell with real t between ±a gives E=ε0+t exp(ika)+t exp(−ika). The diatomic determinant
      is (ε0−E)²−|t|². Disorder removes the requirement of identical diagonal energies.
    assumptions: One normalized orthogonal orbital per site in the two toy models, common full-H diagonal ε0; the displayed
      splitting requires nonzero coupling. Translation symmetry and a lattice-only phase convention for the extension. The
      2011 work did not report a multi-k band test.
  - id: local-dos
    claim: Real-space LDOS contains coherent cross terms in the reconstructed global states, has inverse-volume inverse-energy
      units, and need not track a local orbital's energy alone.
    locations:
