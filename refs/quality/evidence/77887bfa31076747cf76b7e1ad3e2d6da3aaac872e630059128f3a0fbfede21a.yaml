      non-vanishing boundary value can even be discontinuous. Small φ and ∇φ where the mask changes suppress the extra terms.
      Additional hydrogen-centered AO components need not lie in the full system's chosen AO span.
    assumptions: Smooth functions for the classical identity. No claim that OFM used a particular mask, or that an isolated
      metallic or crystalline fragment has vacuum decay.
