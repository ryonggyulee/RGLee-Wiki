    - id: https://www.netlib.org/utk/people/JackDongarra/PAPERS/cpe3152.pdf
      provenance: Yamazaki et al., dense eigensolver and operation counts
      locator: §2, dense Hermitian/symmetric reduction, and generalized dense application
      supports: LAPACK tridiagonal reduction takes leading-order cubic work independently of OFM benchmark.
    check: If z is a bounded neighborhood size and q fixed, there are ≤z N_F/2 off-site pairs (plus on-site blocks), each
      with q² entries. Fixed local box volume/work gives O(N_F)+O(zq²N_F). Dense dimension m=q N_F, reduction requires O(m³)
      work. Empirical wall/CPU-time balance need not persist asymptotically.
    assumptions: Fixed local density, cutoff, target and local discretization; work scaling rather than guaranteed wall-clock
      scaling for arbitrary processor counts. Excludes building a new global SCF solution.
