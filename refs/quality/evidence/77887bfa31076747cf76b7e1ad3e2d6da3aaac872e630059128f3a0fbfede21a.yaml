    check: For n carbons the alkane C_n H_(2n+2) has 6n+2 valence electrons, hence 3n+1 doubly occupied spatial valence orbitals.
      The total is 4, 7, 10 for n=1,2,3. An open N-site chain admits N−p+1 length-p windows. The 5-site example has windows
      123,234,345. 20(20+42)=1240; 20×18×5=1800 and 5×18×3=270. For P3HT with two end hydrogens, 5(20×25+2)=2510 and 12(40×25+2)=12024.
    assumptions: H caps replace cut bonds. Counts are spatial valence orbitals in the pseudopotential convention. Fragment
      orbitals may be linearly dependent; basis count and numerical rank differ.
  - id: basis-boundary
    claim: Clipping a finite-box periodic wavefunction may introduce spurious kinetic contributions; a smooth cutoff has product-rule
      terms localized where the mask varies.
    locations:
