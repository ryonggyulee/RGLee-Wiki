  - id: related-methods
    claim: LS3DF assembles signed fragment density and quantum energy terms with global electrostatics and boundary passivation.
      Atomistic mode-space calculations project selected spectral subspaces for transport.
    locations:
    - §7 comparison table and interpretation
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1103/PhysRevB.77.165113
      provenance: Wang–Zhao–Meza 2008 signed-fragment DFT
      locator: §II, Eqs. (1)–(3) and adjacent paragraphs
      supports: Signed fragment assembly, global Poisson from total density, fragment potentials equal global KS potential
        plus surface correction, SCF potential mixing.
    - id: 10.1007/s11390-023-3011-6
      provenance: Yan et al. 2024 modified LS3DF implementation on independent silicon benchmarks
      locator: §§2.1–2.2, system division and SCF iteration in optimized implementation
      supports: New heterogeneous-machine implementation and distinct bulk-Si test data separate global electrostatic from
        local quantum terms and reconstruct the potential/density in SCF; shares Wang with the original algorithm.
    - id: 10.1103/PhysRevB.85.035317
      provenance: Mil’nikov et al. 2012 nanowire calculations
      locator: Publisher abstract, representative basis within arbitrary energy window
