  findings:
  - id: early-growth
    claim: 결정 표면에서 흡착종의 확산과 탈착, 핵생성과 계단 가장자리 편입이 경쟁한다. 공급률이나 온도가 달라지면 섬의 성장 형태가 달라질 수 있다.
    locations:
    - §1(1) 마지막 문단, §1(2) 마지막 문단
    category: scientific
    status: supported
    method: source
    sources:
    - id: https://www.soft-matter.uni-tuebingen.de/teaching/vorlesung_nano_ss24/BM-Nano-Chapter6.pdf
      provenance: Universität Tübingen, Physics of Nanostructures, ch. 6 lecture script
      locator: §6.1.2, Figs. 6.3–6.4
      supports: 입사 플럭스와 확산 시간 척도의 경쟁, 재탈착, 표면 핵생성·가장자리 편입을 설명한다.
    - id: https://lase.ece.utexas.edu/introduction-mbe-growth
      provenance: UT Austin Laboratory for Advanced Semiconductor Epitaxy
      locator: §5, migration-enhanced epitaxy와 off-axis substrate 문단
      supports: 독립적인 III–V 성장 사례로 흡착원자의 이동 길이, 스텝 간격 및 step-flow에 따른 형상 변화를 다룬다.
    - id: https://pages.jh.edu/aandreo1/495/Archives/2002/LectureNotes/FilmDeposition.pdf
      provenance: R. B. Darling, University of Washington PVD notes reproduced in Andreou
      locator: PVD, surface processes
      supports: 표면의 흡착종과 기판 입사, 탈착 및 증발률 사이의 관계를 다룬다.
    check: 확산과 입사 플럭스의 상대 크기에 따라 섬의 개수·분포가 달라질 수 있고 표면을 떠나는 종은 성장량에서 제외된다.
    assumptions: 결정 표면의 증착 초기이며, 도달한 원자가 모두 남거나 단일 성장 경로를 따른다는 가정은 없다.
  - id: growth-modes
    claim: 젖음의 에너지 조건과 FM·VW·SK의 초기 성장 순서, 정합 변형에 의한 섬 성장 가능성, 평균 두께와 피복 연속성의 구별.
    locations:
    - description, §1(2), §8 첫 항목
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: https://www.soft-matter.uni-tuebingen.de/teaching/vorlesung_nano_ss24/BM-Nano-Chapter6.pdf
      provenance: Universität Tübingen, Physics of Nanostructures, ch. 6 lecture script
      locator: §6.1.1, Figs. 6.1–6.2 및 §6.1.2
      supports: 세 성장 형태와 층·섬 순서, 계면 에너지·미스핏과 성장 동역학의 한계를 명시한다.
    - id: https://arxiv.org/abs/1706.00235
      provenance: Prieto–Markov Madrid/Sofia growth thermodynamics
      locator: §I, pp. 1–2
      supports: Δσ=σ+σi−σs와 젖음, 섬 형성 전 젖음층, 탄성 완화에 따른 에너지 이득 및 추가 면적의 비용을 다룬다.
    check: 평면을 덮을 때의 단위면적 자유에너지 변화는 γfilm+γinterface−γsubstrate이다. 음수이면 덮는 편이 유리하다. 같은 총부피라도 두께의 면적 평균은 섬 사이의 빈 영역이 0임을 알려주지
      못한다. 변형 완화와 표면 면적 증가가 경쟁할 수 있어 SK를 모든 불일치의 필연적 결과로 확대하지 않았다.
    assumptions: 평면 기판의 단위 투영 면적, 먼저 변형 없는 한계에서 비교한다. 비평형 성장에는 표면 이동과 입사 속도도 관여한다.
  - id: geometry-example
    claim: 국소 두께와 기판 위 기준 두께로 계산한 측벽·바닥 피복률 및 종횡비 예제.
    locations:
    - §1(3) 측정 상자, §7 표, §8
    category: scientific
    status: supported
    method: calculation
    sources:
    - id: https://ocw.mit.edu/courses/6-774-physics-of-microfabrication-front-end-processing-fall-2004/1sSADV3Iiuifbp51EEBEB0v15lnIZkjBA_transcript.pdf
      provenance: Hoyt, MIT 6.774, Plummer/Deal/Griffin-based lecture
      locator: 강의록 pp. 1–3
      supports: 배선 단차에서 위치별 박막화, 균일한 피복 및 h/w의 정의를 비교한다.
    - id: 10.1063/1.5060967
      provenance: Cremers/Puurunen/Dendooven conformality analysis
      locator: §II.H, Fig. 7, §III
      supports: 국소 두께비, bottom/top·sidewall/top의 사용과 깊이에 따른 막 두께 프로파일을 구분한다.
    check: 1 μm=1000 nm이므로 h/w=1000/100=10. 9/10×100%=90%, 4/10×100%=40%. 주어진 세 측정값 가운데 최소는 바닥의 4 nm이다. 가상의 수치는 논문 실측치로 인용하지
      않았다.
    assumptions: 증착 전 깊이·입구 폭, 각 면의 법선 방향 두께, 윗면 두께 양수. 측벽 깊이 절반과 바닥 중앙은 서로 다른 시료 위치이다.
  - id: directional-coverage
    claim: 증발 입자의 직선 경로가 가려지거나 스퍼터 원자의 입사각 분포가 달라지면 단차의 국소 박막화가 가능하다. 피복과 내부 충전은 관측 항목이 다르다.
    locations:
    - 도입, §2, §7 금속 배선 및 충전, §8
    category: scientific
    status: supported
    method: source
    sources:
    - id: https://pages.jh.edu/aandreo1/495/Archives/2002/LectureNotes/FilmDeposition.pdf
      provenance: R. B. Darling, University of Washington PVD notes reproduced in Andreou
      locator: Darling, equilibrium vapor pressure 및 evaporation rate, pp. 14–19
      supports: 온도와 증기압에 따른 공급원 방출 및 방출 방향을 다룬다.
    - id: https://www.lithoguru.com/scientist/CHE323/
      provenance: C. A. Mack, CHE323/CHE384, Campbell-based lectures
      locator: Lectures 20–21, L21 slides 2–3, 8–10; L23 slides 2–5
      supports: 충돌이 드문 진공, 입사각·음영과 via fill 공극을 비교한다.
    - id: https://ocw.mit.edu/courses/6-774-physics-of-microfabrication-front-end-processing-fall-2004/1sSADV3Iiuifbp51EEBEB0v15lnIZkjBA_transcript.pdf
      provenance: Hoyt, MIT 6.774, Plummer/Deal/Griffin-based lecture
      locator: 강의록 pp. 1–3, 5–6
      supports: 불균일 금속 피복의 얇은 위치, 단차와 좁은 간격의 공극, 증발 경로와 시야 가림을 예시한다.
    check: 온도에 따른 방출률, 기하학적 전달과 음영을 구분했다. 평탄부 두께만으로 국소 최솟값을 정할 수 없고, 개구가 먼저 닫히면 내부 공극이 남는다는 단면 해석은 두 강의의 사례와 일치한다.
    assumptions: 평균 자유 행로가 소스-기판 거리보다 큰 직진 증발의 한계. 스퍼터 조건에는 산란과 입사각 분포가 있다.
  - id: cvd-crossover
    claim: 일차 정상상태 모형의 직렬 저항, 성장률 환산과 양 극한. 두 계수가 같을 때 k_s만 두 배로 하면 플럭스는 4/3배이다.
    locations:
    - §3(1)–(3), §7–8 CVD 결론
    category: scientific
    status: supported
    method: calculation
    sources:
    - id: https://ocw.mit.edu/courses/6-774-physics-of-microfabrication-front-end-processing-fall-2004/1sSADV3Iiuifbp51EEBEB0v15lnIZkjBA_transcript.pdf
      provenance: Hoyt, MIT 6.774, Plummer/Deal/Griffin-based lecture
      locator: pp. 7–10, 경계층에서 농도와 flux를 도입해 film velocity를 구하는 부분
      supports: 기상 전달·일차 표면 플럭스, 정상상태에서 둘의 일치와 수밀도를 사용한 두께 변환을 명시한다.
    - id: https://www.lithoguru.com/scientist/CHE323/
      provenance: C. A. Mack, CHE323/CHE384, Campbell-based lectures
      locator: Lecture 24 slides 4–11, Lecture 25 slides 2–9
      supports: 독립 교재·강의의 농도 경계조건, 정상상태 속도식, 온도/유동 민감도 및 압력에 따른 영역 이동을 대조했다.
    check: h(Cg−Cs)=kCs에서 Cs=hCg/(h+k), J=hkCg/(h+k). k=h이면 J=hCg/2, k=2h이면 J=2hCg/3, 비는 4/3이다. [J] m⁻²s⁻¹에 편입부피 m³를 곱하면 m/s이다.
      k/h→0에서는 반응 제한, h/k→0에서는 전달 제한이다. 평탄부 모형에는 트렌치 깊이 좌표나 옆벽 소비가 없다.
    assumptions: 평탄부의 국소 정상상태, 단일 지배 전구체, 양의 계수, 정반응 일차 소비. 예제에서는 Cg, hg 및 편입당 부피를 고정한다.
  - id: gan-inlet
    claim: GaN의 NH₃/TMGa 입력 몰 유량비를 두 방식으로 배가할 수 있으며, 표면 활성종과 성장률에는 절대 유량과 반응·수송도 관여한다.
    locations:
    - §4 세 문단, §7 표, §8 마지막 항목
    category: scientific
    status: supported
    method: calculation
    sources:
    - id: 10.3390/ma12152455
      provenance: Ciarkowski et al., Virginia Tech and collaborators, OMVPE experiments
      locator: §§1–3, Table 1, Fig. 2
      supports: NH3 대 TMGa 비를 정의하고 수송·부반응에 따른 성장 효율 및 TMGa 유량에 따른 성장률을 실험 조건별로 제시한다.
    - id: 10.1002/pssr.202100202
      provenance: Y. Zhang et al., Ohio State, laser-assisted MOCVD experiments
      locator: §§1, 2.2, Fig. 3, Table 2
      supports: 다른 연구팀이 NH3 분해를 제어하며 성장률과 TMGa 유량을 비교하고 같은 입력비에서도 유효 활성종 비가 달라지는 조건을 논한다.
    check: 원래 유량 A,B에서 2A/B=A/(B/2)=2A/B. 후자의 단위 시간당 Ga 공급은 B/2이다. 두 조작에서 성장률이 얼마나 바뀌는지는 이 산술로 결정할 수 없다.
    assumptions: 각 분자에 각각 N 또는 Ga 하나, 유량은 같은 몰/시간 단위, 비교마다 나머지 한쪽 유량은 고정한다.
  - id: surface-chemistry
    claim: 수산화 표면에서 TMA의 리간드 교환과 CH₄ 방출, 다음 물 주입에 의한 메틸기의 제거·수산기 재생.
    locations:
    - §5(1) Al₂O₃ 예제
    category: scientific
    status: supported
    method: source
    sources:
    - id: 10.1039/C5CP01912E
      provenance: Weckman/Laasonen, Aalto atomistic calculations
      locator: 2015, Phys. Chem. Chem. Phys. 17, 17322–17334, 반응 R1–R3 및 §3
      supports: 배위 환경별 리간드 교환과 두 반쪽 반응의 표면 종 및 메테인 부산물을 계산했다.
    - id: https://escholarship.org/uc/item/2vr3z5pd
      provenance: J. L. Cho, UCLA doctoral experiments
      locator: 2015 UCLA doctoral thesis, Figs. 2.9–2.10, 3.1–3.3
      supports: 독립적인 제자리 FTIR 측정으로 TMA/물 교대 후 표면 종단기의 소모·재생을 확인하고 메테인 방출 경로를 해석했다.
    check: R1과 R3에서 한 개 또는 두 개 수산기와 반응하면 남은 메틸기 개수가 다르다. R2는 물과 반응 시 CH₄ 방출과 OH 도입을 보인다. 독립 FTIR 실험은 TMA 뒤 Al–CH₃ 증가와 OH 감소,
      물 뒤 반대 변화를 관측했다. 메테인 생성 경로와 FTIR로 직접 관측한 표면 진동을 구분했다.
    assumptions: TMA/물 열 ALD의 대표 경로이며 Al당 잔류 리간드 수를 고정하지 않는다.
  - id: ald-exposure
    claim: 각 반응물의 노출, 충분한 퍼지 및 깊이 방향 두께를 구분해 ALD 포화를 해석한다. 충분히 일정한 분압의 노출량은 분압과 시간의 곱이다.
    locations:
    - §5(2) 측정, §5(3) 첫 문단, §7–8 ALD
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: 10.1063/1.5060967
      provenance: Cremers/Puurunen/Dendooven conformality analysis
      locator: §II.D, II.H, Fig. 7 및 §VI
      supports: 노출량과 분압/펄스 시간 및 표면 피복, 구조 안 분압·표면 반응과 깊이별 두께 관계를 다룬다.
