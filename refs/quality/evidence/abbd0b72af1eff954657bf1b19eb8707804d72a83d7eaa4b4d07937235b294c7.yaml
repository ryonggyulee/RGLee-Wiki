      provenance: Vukmirović and Wang, JCP 134 (2011), 094119
      locator: §II, Fig. 1, §III.A, Fig. 2
      supports: 유한 분자를 상자에 넣어 조각 CPM, 주기 Poisson, LDA, 평면파 ESCAN 순서로 궤도를 계산한다. 그룹 내 CPU와 그룹 사이의 조각 병렬화를 명시한다. 알케인의 끊긴 결합을
        종결하고 결합을 포함하도록 조각을 겹친다.
    - id: https://ocw.mit.edu/courses/5-61-physical-chemistry-fall-2007/b0101a5df1b17809fc75a0256af6aaf6_lecture28to29.pdf
      provenance: MIT 5.61 Physical Chemistry, Lecture 28 (2007)
      locator: pp. 3–6, 9–10의 두 중심 분자 궤도
      supports: 다른 중심에 놓인 두 함수를 동일한 공간에서 합성한 후 진폭을 제곱해 공간 분포를 얻는 독립적인 분자 예제.
    check: 123과 234의 내부 결합은 각각 {12,23}과 {23,34}이다. 절단한 끝의 수소는 조각 고유함수에만 영향을 준다. 국소 연산자의 정규화된 고유함수에 대해 H_LL−ε_L=〈φ_L|(H−h_L)|φ_L〉이므로
      전체 환경의 대각 원소는 고립 조각의 에너지와 일반적으로 다르다. 같은 r에서 합성한 진폭의 절댓값 제곱에는 2 Re[(a_Lφ_L)*a_Rφ_R]가 남는다.
    assumptions: 네 탄소 예제는 교육용이다. 조각별 단독 분자 계산도 퍼텐셜 해법에는 논문이 명시한 주기 상자 경계를 사용한다.
