      supports: 환경이 같은 작은 기준계의 DFT 밀도에서 원자별 기여를 취해 큰 계의 밀도를 조합하는 CPM의 원래 방법.
    - id: 10.1021/jp1114527
      provenance: Vukmirović and Wang, JPCB 115 (2011), 1792–1797
      locator: Theory, pp. 1793–1794, Fig. 1
      supports: P3HT 응용에서 혼합 밀도에 대한 Poisson/Hartree·LDA 연산자 구성 및 대역 가장자리 정공 상태를 위한 조각 기저와 기준 대각화의 비교.
    check: Eq. (1)에서 원자단위계의 운동항은 −∇²/2이고 Hartree와 교환·상관 항은 밀도에 의존한다. 전체 계에서 이 밀도로 만든 H와 처음부터 같은 H를 사용해야 기저 선택의 오차를 분리할 수 있다.
      Fig. 3의 비교 해는 60 Ry 평면파이다. 제거 에너지를 KS HOMO 고유값으로 정량화하는 주장은 본문에 없다.
    assumptions: 원문의 비자기일관 CPM/LDA 유사퍼텐셜 구현이다. 동일 저자들의 원 연구와 후속 응용을 절차와 적용 사례로 대조했다. 연구 간 독립 재현이나 임의의 고분자에 대한 정확도를 주장하지 않는다.
  - id: separate-fragment-orbitals
    claim: 공유 결합을 포함하는 조각에 대해 각각 독립된 분자 궤도를 계산하고 이 함수를 전체 구조 좌표에서 합성한다.
