      locator: Positive Definite, Eq. (90) 전후의 양의 정부호 행렬 유도 노름
      supports: S 노름과 양의 정부호 행렬의 제곱근을 이용한 정규화.
    check: Φ의 열을 φ_j로 두고 Φ†(ĤΦa−EΦa)=0을 곱셈 순서대로 전개하면 H_ij=〈φ_i|Ĥφ_j〉, S_ij=〈φ_i|φ_j〉이다. 열 j는 Ĥ를 한 번 적용해 모든 i에서 재사용하며 Ĥ의
      비국소 이온 항도 이 표현에 포함된다. Φ를 고정하고 국소 퍼텐셜을 바꿔 얻는 δH_LR=〈φ_L|δv|φ_R〉와 ||Φa||²=a†Sa를 다시 유도했다. 이 노름은 §6의 직교화·복원과 §7의 S=U†S₀U에
      일치한다.
    assumptions: 기저 함수들은 같은 좌표에 둔다. 복소수 위상의 밀도 간섭은 실수 부호 간섭을 포함한다. 정규화는 실제 파동함수에 부과한다.
