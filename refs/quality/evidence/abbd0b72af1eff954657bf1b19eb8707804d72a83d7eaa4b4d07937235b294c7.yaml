      provenance: Vukmirović and Wang, JCP 134 (2011), 094119
      locator: §III.A–B, Figs. 3–6
      supports: 축소된 행렬의 잔차와 별도로 같은 H의 평면파 해를 기준 삼아 조각 기저 선택 오차를 평가한 근거.
    check: v±=(1,±1)에 대해 Hv±=(ε±t)v±, Sv±=(1±s)v±이고 v±†Sv±=2(1±s)이다. ε=0, t=−0.24 eV, s=0.20을 대입해 E+=−0.20 eV, E−=0.30 eV를
      얻었다. Python 배정밀도 산술로 검산한 양의 조합 계수는 (0.6454972244,0.6454972244), 음의 조합은 (0.7905694150,−0.7905694150)이다. 표시 전 정밀도에서 두
      해의 잔차 최대성분은 약 2.8×10⁻¹⁷ eV이고 S 노름의 제곱은 각각 1, 0.9999999999999998이다. 작은 행렬의 해가 정확해도 선택 공간 바깥의 성분은 이 검사로 평가할 수 없다.
    assumptions: 두 정규화된 기저의 중첩 고유값이 1±s로 양수가 되도록 |s|<1이다. 두 모형의 H 대각값은 같으며 전역 위상이나 고유벡터의 출력 순서는 자유롭다.
