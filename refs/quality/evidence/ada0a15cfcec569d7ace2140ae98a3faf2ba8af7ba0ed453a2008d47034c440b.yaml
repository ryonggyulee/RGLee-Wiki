      locator: §§II, III.A, Fig. 2(a) 및 Fig. 3
      supports: 수소 종결한 메탄·에탄·프로판과 슬라이딩 이합체, 원래 구조의 H와 조각 파동함수를 명시한다.
    - id: https://ocw.mit.edu/courses/5-61-physical-chemistry-fall-2007/b0101a5df1b17809fc75a0256af6aaf6_lecture28to29.pdf
      provenance: MIT 5.61, Fall 2007, Lecture 28
      locator: pp. 3–6
      supports: 부분을 나타내는 공간 함수들의 선형결합으로 분자 전체의 시도 파동함수를 만드는 독립적 예. 탄소 분할의 화학적 자료는 OFM 논문이 제공한다.
    check: 순서대로 연결된 1234에서는 내부 결합 집합이 123→{12,23}, 234→{23,34}이다. 합집합은 세 원래 결합 전부, 교집합은 23이다. 분리한 12와 34의 합집합에는 23이 없다. 수소
      종결이 더하는 핵은 조각 연산자에서만 쓰이므로 원래 H의 탄소 수는 네 개다. 원 논문의 그림은 C20 사슬의 이합체 예이고, 본문의 네 탄소 삼합체는 별도 설명용이다.
    assumptions: 열린 알케인, 탄소 연결만 표에서 센다. 조각 기저의 중첩이 독립 전자의 수 또는 원자의 수를 증가시키지 않는다.
  - id: waves-and-environment
    claim: 원래 사슬의 H를 조각 함수로 투영하고 계수 합성 후 제곱하면 간섭·환경 효과와 정규화가 주어진다.
