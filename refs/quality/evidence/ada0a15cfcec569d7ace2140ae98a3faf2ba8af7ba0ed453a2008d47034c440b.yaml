    - id: https://ocw.mit.edu/courses/5-61-physical-chemistry-fall-2007/b0101a5df1b17809fc75a0256af6aaf6_lecture28to29.pdf
      provenance: MIT 5.61, Fall 2007, Lecture 28
      locator: pp. 3, 5–8
      supports: 시도 계수, 대각/비대각 원소, 규격화 및 일반화 고유식의 화학적 유도.
    - id: https://netlib.org/utk/people/JackDongarra/etemplates/node178.html
      provenance: Bai et al., SIAM Templates (2000)
      locator: §5.7.1, Eq. (90)–(91)
      supports: 양의 정부호 중첩 행렬의 유도 노름·좌표 변환.
    check: Φ의 열을 φ_j라 하면 Φ†(ĤΦa−EΦa)=0에서 Ha=ESa, ||Φa||²=a†Sa가 된다. 두 함수의 밀도에는 2Re(aL* aR φL*φR)가 남아 상대부호로 바뀐다. δH_LR=〈φL|Δv|φR〉은
      기저 고정 시 정확한 식이다. 일정한 Δv라면 δH_LR=Δv S_LR도 성립한다. 원래 H를 한 번만 구성하고 중복 부위는 기저에만 포함한다. S의 작은 고유값은 단위 계수 조합 중 작은 노름 방향에 대응한다.
    assumptions: 정규화한 함수, 공통 좌표, Hermitian H. 물리적 상태 결합은 H와 S로 함께 계산하며 행렬 원소 하나의 값에는 에너지 영점·기저 규약이 반영된다. 더 긴 사슬에서는 두 조각 바깥
      원자도 있을 수 있다.
