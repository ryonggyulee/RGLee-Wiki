      supports: 전체 CPM H와 조각별 CPM, 주기 Poisson/LDA/ESCAN, 60 Ry 비교, 개별 오차·시간·부분 HOMO의 DOS 틈 기준.
    check: Fig. 3의 하단/상단을 차례로 대조하면 C1 >200 meV/~1 eV, C2 ~10/~30 meV, C3 <1/<10 meV이다. 삼합체 최저 하나 ~30 meV, 상단 2–4개에서 짝짓기 불가,
      다섯 개에서 개선. P3HT 하나 ~30→120 meV (0.7 eV 밴드 안쪽), 세 개 10–50 meV, 네 개에서 악화. Fig. 7은 알케인 최저 구간의 단일 함수 기준 5 Å 수렴. Fig. 9는
