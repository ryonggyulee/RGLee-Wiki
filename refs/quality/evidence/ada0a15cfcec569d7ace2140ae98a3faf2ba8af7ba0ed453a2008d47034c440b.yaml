    check: 중성 C_nH_(2n+2)는 가전자 6n+2개이므로 이중 점유 공간 궤도 3n+1개, 즉 4/7/10개이다. 20(20+42)=1,240. 20단위 열린 사슬에서 시작 위치는 1…18이고 20×18×5=1,800,
