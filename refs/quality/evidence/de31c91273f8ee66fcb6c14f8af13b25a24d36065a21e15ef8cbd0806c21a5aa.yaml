      scope: '기준본과의 diff는 세 그림과 연결 문장에 한정된다. 기존 target-and-input 및 separate-fragment-orbitals의 관심 구간 선택, CPM 퍼텐셜, 단독 조각의 종결·계산과
        병렬화 설명은 그대로이다. assemble-and-project와 solve-and-check 중 그림과 맞물리는 투영·정규화는 아래에서 다시 검산했다. §5의 정량 시험과 규모, §6의 P3HT 비교·LDOS,
        §7의 투영·경계 조건·다른 방법, §8의 요약과 §9 문헌은 그대로여서 기준본이 명시한 승계 범위가 적용된다. 기준본의 assets는 비어 있다.

        '
  findings:
  - id: shared-carbon-bond
    claim: 한 자리 간격의 세 탄소 조각 두 개가 네 탄소 사슬의 전체 결합을 덮고, 양쪽에 포함된 2–3 결합을 각 조각의 궤도로 표현할 수 있다.
    locations:
    - §2(1) 분할 예와 그림 1
    - §2(2) 기저 전개
    - §8 조각 선택 요약
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: https://doi.org/10.1063/1.3560956
      provenance: Vukmirović–Wang, J. Chem. Phys. 134, 094119 (2011)
      locator: Sec. III.A, Fig. 2(a) 및 trimer 설명
      supports: 원문은 탄소 간 결합의 양 끝을 적어도 한 조각 안에 넣는 이유를 밝히고 알케인에서 이량체와 삼량체를 시험한다. Fig. 2(a)는 이량체 분할이다.
    - id: https://doi.org/10.1021/ct300985h
      provenance: Richard–Herbert, J. Chem. Theory Comput. 9, 1408–1416 (2013)
      locator: Sec. I, p. 1408, Eq. (1.5) 전후
      supports: 공통 핵을 갖는 두 조각의 교집합을 정의한다. 그림의 원자 집합 관계를 대조하는 근거로 사용했다.
    check: 'L={1,2,3}, R={2,3,4}의 교집합은 {2,3}이다. 사슬의 이웃쌍만 세면 L의 변은 12·23, R의 변은 23·34이다. SVG에서 세 줄의 탄소 2는 모두 x=310, 탄소 3은 x=418에
      있고 두 탄소를 연결하는 선분은 y=76,150,224의 세 줄 모두에 있다. 12와 34도 각 조각 행과 위쪽 전체 행에서 일치한다.

      '
    assumptions: 유한한 선형 사슬의 탄소 골격과 결합 연결성을 설명하는 모식도이다. 그림의 네 탄소는 교육용 예이고, 원 논문의 Fig. 2(a)는 20탄소 사슬이다.
  - id: projected-columns
    claim: 오른쪽 기저 함수를 고르면 S와 H의 둘째 열이 결정되며, 두 행은 각각 왼쪽·오른쪽 함수의 켤레로 투영한다.
    locations:
    - §3 행렬 적분과 그림 2
    - §4(1)의 첫째 행과 Ha=ESa
    category: scientific
    status: supported
    method: derivation
    sources:
    - id: https://doi.org/10.1063/1.3560956
      provenance: Vukmirović–Wang, J. Chem. Phys. 134, 094119 (2011)
      locator: Sec. II, Fig. 1 전후의 S 및 H 내적 정의와 Eq. (2)
      supports: 전체 KS 연산자를 조각 함수에 적용하며 두 조각의 내적으로 H와 S를 만든다.
    - id: https://ocw.mit.edu/courses/5-61-physical-chemistry-fall-2007/b0101a5df1b17809fc75a0256af6aaf6_lecture28to29.pdf
      provenance: MIT 5.61 Physical Chemistry, Lecture 28 (2007)
      locator: pp. 7–8, H 및 S의 2×2 행렬 표기, Eq. (2)
      supports: 두 함수의 기저 순서가 각 행과 열의 적분에 대응하며 계수를 곱하면 투영한 고유값 방정식을 얻는다.
    check: '열 선택 벡터 e_R=(0,1)을 곱하면 S e_R=(〈L|R〉,〈R|R〉), H e_R=(〈L|Ĥ|R〉,〈R|Ĥ|R〉)이다. 두 기저의 왼쪽 인자를 복소켤레하면 본문의 적분식이다. SVG 양쪽에서
      R열만 채색되어 있고 위쪽은 S_LR/H_LR, 아래쪽은 S_RR/H_RR이다. 다른 열도 LL, RL 순서이다.

      '
    assumptions: 기저 순서는 L,R이며 Ĥ는 전체 구조의 연산자이다. S의 대각 성분이 1인 조건은 각 기저 함수의 정규화이다.
  - id: gaussian-interference-and-normalization
    claim: 중첩 0.20의 가우스 함수 둘을 정규화해 더하거나 빼면 중점에서 차의 확률밀도만 0이고 두 밀도의 전공간 적분은 각각 1이다.
    locations:
    - §2(2) 같은 위치의 합성
    - §4(2) 두 궤도 식, 수치 예와 그림 3
    - §6(1) 확률밀도
    category: scientific
    status: supported
    method: calculation
    sources:
    - id: https://ocw.mit.edu/courses/5-61-physical-chemistry-fall-2007/b0101a5df1b17809fc75a0256af6aaf6_lecture28to29.pdf
      provenance: MIT 5.61 Physical Chemistry, Lecture 28 (2007)
      locator: pp. 8–10, 대칭인 두 함수의 합·차 상태와 각 에너지
      supports: 같은 대각 에너지와 실수 중첩·결합에서 두 상태의 상대 부호와 에너지 분모를 제시한다.
    - id: https://www.netlib.org/utk/people/JackDongarra/etemplates/node178.html
      provenance: Bai et al., Templates for the Solution of Algebraic Eigenvalue Problems (SIAM, 2000)
      locator: §5.7.1 Positive Definite B, Eq. (90) 아래의 M 내적·노름
      supports: 양의 정부호 중첩 행렬에서 상태의 계수 노름은 그 행렬이 정하는 이차형식으로 계산한다.
    check: '그림의 두 중심은 ±a, a=√ln5이다. 각각 g=π^(−1/4)exp[−(x∓a)²/2]로 쓰면 ∫g²dx=1이고 두 함수의 곱은 π^(−1/2)exp(−x²−a²)이므로 s=exp(−a²)=1/5이다.
      부호 벡터 (1,±1)의 S 노름 제곱은 2(1±s)이며 두 정규화된 밀도는 전공간 적분값 1을 갖는다. ε=0, t=−0.24 eV를 대입한 에너지는 −0.20과 +0.30 eV이다. x=0에서 각 진폭은
      0.3359135554, 두 밀도는 0.1880631945와 0이다. 두 중점 표식도 같은 값이다. 가로 좌표 X=319+61x, 세로 좌표 Y=186−145g 또는 Y=395−290ρ로 해석하여 네 SVG
      곡선 각각의 321개 꼭짓점을 x=−4+0.025j에서 다시 계산했다. 세로 오차는 네 곡선 모두 0.005 SVG 단위 미만으로 좌표의 반올림 정밀도와 맞는다. SVG 표시 구간의 두 밀도 사다리꼴 적분은
      각각 0.999947, 0.999937이다. ±12 범위에서 간격 0.001로 중점 적분하면 두 값 모두 1에서 4×10⁻¹⁵ 이내이다.

      '
    assumptions: '무차원 실수 좌표에서 폭이 같은 양의 가우스 함수를 택했다. 전체 면적 정규화는 실수축 전체에서 정의한다. 행렬의 s와 상대 부호를 공간적으로 나타내는 교육용 모형이다.

      '
  summary: 기준본 이후 추가·변경한 세 그림, 캡션과 설명이 원문 근거와 독립 계산에 부합한다. 탄소의 소속과 결합, 투영 행렬의 인덱스 및 오른쪽 열, 중점 진폭과 밀도, 전공간 정규화를 확인했다. 새 그림
    세 개는 각각 현재 SVG 해시로 식별했다. 확인 범위에 미해결 항목이 없다.
